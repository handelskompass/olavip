<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OLAVIP</title>
  <meta name="theme-color" content="#070707" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span>OLA</span>VIP</a>
    <nav>
      <button data-filter="all" class="active">الكل</button>
      <button data-filter="bags">حقائب</button>
      <button data-filter="accessories">إكسسوارات</button>
      <button data-filter="beauty">مكياج</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">OLAVIP COLLECTION</p>
        <h1>أناقة سوداء<br><span>بتفاصيل ذهبية</span></h1>
        <p class="lead">واجهة مستقلة لعرض منتجات OLAVIP، مصممة للموبايل أولاً وبأسلوب فاخر وسريع.</p>
        <a class="cta" href="#products">تسوق المجموعة</a>
      </div>
      <div class="hero-card">
        <img src="./IMG-20261005-WA0003.jpg" alt="OLAVIP" />
      </div>
    </section>

    <section class="section-head" id="products">
      <div>
        <p class="eyebrow">المنتجات</p>
        <h2>مجموعة OLAVIP</h2>
      </div>
      <span id="count"></span>
    </section>

    <section id="grid" class="grid"></section>
  </main>

  <dialog id="productDialog">
    <button class="close" aria-label="إغلاق">×</button>
    <div class="dialog-layout">
      <img id="dialogImage" alt="" />
      <div class="dialog-copy">
        <p class="eyebrow">OLAVIP</p>
        <h3 id="dialogTitle"></h3>
        <p class="muted">تفاصيل المنتج والسعر يتم تحديثهما من إدارة OLAVIP.</p>
        <div class="price">السعر عند الطلب</div>
        <button class="buy">اطلب الآن</button>
      </div>
    </div>
  </dialog>

  <footer>© 2026 OLAVIP</footer>
  <script src="./app.js"></script>
</body>
</html>
